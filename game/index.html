<title>Gobbler's Getaway — a turkey escape game</title>
<style>

</style>

<canvas id="game" role="img" aria-label="Gobbler's Getaway: a plucky turkey jumps hay bales, ovens and pitchforks, ducks under carving knives, collects corn and golden feathers, and outruns a farmer for 800 metres through an autumn farm at dusk."></canvas>
<p id="status" role="status" aria-live="polite"></p>
